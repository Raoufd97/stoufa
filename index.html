<!doctype html><html lang="fr"><head><meta charset=utf8><meta name="theme-color" content="#17624F"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Stoufa"><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="icon-180.png"><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Boutique de Stoufa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout : appli mobile, en-tête collant, liste de fiches, barre d'onglets en bas. Étiquettes d'emplacement façon étiquette de bac jaune. */
:root{
  --bg:#EEF1EE; --surface:#FFFFFF; --ink:#18211E; --muted:#5B6964; --line:#D3DBD7;
  --accent:#17624F; --accent-ink:#FFFFFF; --accent-soft:#DDEDE6;
  --tag:#F4C430; --tag-ink:#2A2205;
  --warn:#9A5B00; --warn-bg:#FBEBD0; --bad:#B3261E; --bad-bg:#F8E0DC;
  --shade:rgba(16,24,21,.45);
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1513; --surface:#18201D; --ink:#E6EDE9; --muted:#97A7A1; --line:#2B3632;
  --accent:#4DBE9A; --accent-ink:#06201A; --accent-soft:#18352C;
  --tag:#E2B42A; --tag-ink:#231B02;
  --warn:#F2AE45; --warn-bg:#3A2B12; --bad:#FF8B80; --bad-bg:#3D1B18;
  --shade:rgba(0,0,0,.6); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0F1513; --surface:#18201D; --ink:#E6EDE9; --muted:#97A7A1; --line:#2B3632;
  --accent:#4DBE9A; --accent-ink:#06201A; --accent-soft:#18352C;
  --tag:#E2B42A; --tag-ink:#231B02;
  --warn:#F2AE45; --warn-bg:#3A2B12; --bad:#FF8B80; --bad-bg:#3D1B18;
  --shade:rgba(0,0,0,.6); color-scheme:dark;}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-variant-numeric:tabular-nums}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 10px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
h1{font-family:var(--f-display);font-weight:700;font-size:28px;letter-spacing:.01em;margin:0;line-height:1;text-transform:uppercase}
.brand small{color:var(--muted);font-size:13px}
.search{margin-top:10px;display:flex;gap:8px}
.search input{flex:1;min-width:0;height:44px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:0 14px}
.chips{display:flex;gap:6px;margin-top:10px;overflow-x:auto;scrollbar-width:none}
.chip{flex:none;height:32px;padding:0 12px;border-radius:16px;border:1px solid var(--line);background:var(--surface);font-size:14px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

main{padding-block:14px 120px}
.view{display:flex;flex-direction:column;gap:12px}

.banner{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--accent-soft);border-radius:10px;padding:10px 12px;font-size:14px}
.banner button{border:0;background:none;color:var(--accent);font-weight:600;padding:4px 0}

.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.item{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;padding:10px 12px;border:0;border-top:1px solid var(--line);background:none;text-align:left;width:100%}
.item:first-child{border-top:0}
.thumb{width:64px;height:64px;border-radius:8px;background:var(--bg);object-fit:cover;display:grid;place-items:center;color:var(--muted);overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb.sm{width:44px;height:44px}
.item .info{min-width:0;display:flex;flex-direction:column;gap:4px}
.item .nom{font-weight:600;line-height:1.2;overflow-wrap:anywhere}
.meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.bin{font-family:var(--f-mono);font-weight:700;font-size:12px;letter-spacing:.04em;background:var(--tag);color:var(--tag-ink);padding:2px 6px;border-radius:3px;text-transform:uppercase;white-space:nowrap}
.bin.vide{background:none;border:1px dashed var(--line);color:var(--muted);font-weight:500}
.right{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.prix{font-family:var(--f-display);font-weight:600;font-size:19px;white-space:nowrap}
.qty{font-size:13px;font-weight:600;padding:2px 8px;border-radius:10px;background:var(--bg);white-space:nowrap}
.qty.low{background:var(--warn-bg);color:var(--warn)}
.qty.out{background:var(--bad-bg);color:var(--bad)}

.empty{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:28px 20px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.empty h2{font-family:var(--f-display);font-size:24px;margin:0;text-transform:uppercase}
.empty p{margin:0;color:var(--muted);max-width:44ch}
.steps{text-align:left;margin:4px 0 0;padding-left:20px;color:var(--muted);font-size:15px;display:flex;flex-direction:column;gap:4px}

.btn{height:48px;padding:0 18px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:default}

.fab{position:fixed;right:max(16px,calc(env(safe-area-inset-right,0px) + 16px));bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:6;height:52px;padding:0 20px;border-radius:26px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:16px;box-shadow:0 6px 18px rgba(0,0,0,.18);display:flex;align-items:center;gap:6px}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .wrap{display:grid;grid-template-columns:repeat(4,1fr)}
.citem{display:grid;grid-template-columns:auto 44px minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:10px 12px;border-top:1px solid var(--line)}
.citem:first-child{border-top:0}
.citem .info{min-width:0;display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.citem .nom{font-weight:600;line-height:1.2;overflow-wrap:anywhere}
.citem.done .nom{text-decoration:line-through;color:var(--muted)}
.ck{display:grid;place-items:center;width:32px;height:32px;cursor:pointer}
.ck input{width:24px;height:24px;accent-color:var(--accent);cursor:pointer}
.mini{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.mini button{width:32px;height:34px;border:0;background:var(--bg);font-size:18px;font-weight:600}
.mini span{min-width:28px;text-align:center;font-weight:600}
.cdel{width:32px;height:34px;border:0;background:none;color:var(--muted);font-size:22px;line-height:1}
.btn.slim{height:34px;padding:0 10px;font-size:13px}
.tagauto{font-size:12px;font-weight:600;color:var(--bad);background:var(--bad-bg);padding:2px 8px;border-radius:10px;white-space:nowrap}
.lrow.sub{padding-block:8px;background:var(--bg)}
.cpf{margin-top:2px;width:100%;max-width:220px;gap:2px}
.cpf input{height:38px;font-size:15px}
.citem.done .cpf input{background:var(--surface)}
.thumb.xs{width:32px;height:32px;border-radius:6px}
.thumb.xs svg{width:18px;height:18px}
.lies{display:flex;flex-wrap:wrap;gap:8px}
.lie{display:inline-flex;align-items:center;gap:8px;max-width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:4px 8px 4px 4px;text-align:left;font-weight:600;font-size:14px}
.lie .lnom{min-width:0;overflow-wrap:anywhere}
.lie .qty{font-size:12px}
.lie.on{padding-right:2px}
.lx{width:30px;height:30px;border:0;background:none;color:var(--muted);font-size:20px;line-height:1}
.tagok{font-size:12px;font-weight:600;color:var(--accent);background:var(--accent-soft);padding:2px 8px;border-radius:10px;white-space:nowrap}
.combo{position:relative}
.combo input{height:50px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:0 14px;width:100%;font-size:17px}
.combo input:focus{border-color:var(--accent)}
.sug{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:8;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 28px rgba(0,0,0,.16);max-height:340px;overflow-y:auto}
.sug button{display:grid;grid-template-columns:44px 1fr auto;gap:10px;width:100%;padding:8px 10px;border:0;border-top:1px solid var(--line);background:none;text-align:left;align-items:center}
.sug button:first-child{border-top:0}
.sug button[aria-selected="true"]{background:var(--accent-soft)}
.sug .none{padding:14px;color:var(--muted);font-size:14px}
.selcard{display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:center}
.step{display:grid;grid-template-columns:46px 1fr 46px;border:1px solid var(--line);border-radius:10px;overflow:hidden;height:46px}
.step button{border:0;background:var(--bg);font-size:22px;font-weight:600}
.step input{border:0;border-left:1px solid var(--line);border-right:1px solid var(--line);text-align:center;font-size:18px;font-weight:600;min-width:0;width:100%;background:var(--surface)}
.total{display:flex;justify-content:space-between;align-items:baseline;gap:10px;border-top:1px solid var(--line);padding-top:10px}
.total b{font-family:var(--f-display);font-size:28px}
.warnbox{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:8px 10px;font-size:14px}
.undo{border:1px solid var(--line);background:var(--bg);border-radius:8px;height:34px;padding:0 10px;font-size:13px;font-weight:600}
.undo.armed{background:var(--bad-bg);color:var(--bad);border-color:var(--bad)}
nav.tabs button{height:62px;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;padding:0;min-width:0;font-weight:600;color:var(--muted)}
nav.tabs button[aria-current="page"]{color:var(--accent)}
nav.tabs svg{width:22px;height:22px}

.section-h{font-family:var(--f-display);font-weight:700;font-size:20px;text-transform:uppercase;letter-spacing:.02em;margin:8px 0 0}
.hint{color:var(--muted);font-size:14px;margin:0}

/* Comptage */
.crow{display:grid;grid-template-columns:44px 1fr 84px;gap:10px;align-items:center;padding:10px 12px;border-top:1px solid var(--line)}
.crow:first-child{border-top:0}
.crow .info{min-width:0}
.crow input{width:84px;height:44px;border:1px solid var(--line);border-radius:8px;background:var(--bg);text-align:center;font-size:18px;font-weight:600}
.crow input:focus{border-color:var(--accent);background:var(--surface)}
.diff{font-size:13px;font-weight:600}
.diff.sold{color:var(--accent)}
.diff.plus{color:var(--warn)}
.stickybar{position:fixed;left:0;right:0;bottom:calc(62px + env(safe-area-inset-bottom,0px));z-index:6;background:var(--bg);border-top:1px solid var(--line);padding-block:10px}

/* Bilan */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.kpi span{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.kpi b{display:block;font-family:var(--f-display);font-weight:700;font-size:26px;margin-top:2px;line-height:1.1}
.kpi.hero{grid-column:1/-1;background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.kpi.hero span{color:inherit;opacity:.85}
.kpi.hero b{font-size:34px}
.monthsel{display:flex;align-items:center;justify-content:space-between;gap:8px}
.monthsel h2{font-family:var(--f-display);font-size:24px;margin:0;text-transform:capitalize}
.iconbtn{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.iconbtn:disabled{opacity:.35}
.bars{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 12px 10px}
.bars .grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;align-items:end;height:120px;border-bottom:1px solid var(--line)}
.bar{position:relative;display:flex;flex-direction:column;justify-content:flex-end;height:100%;border:0;background:none;padding:0;cursor:pointer;min-width:0}
.bar .bv{font-size:12px;font-weight:600;text-align:center;color:var(--ink);margin-bottom:3px;white-space:nowrap}
.bar.sel .bv{color:var(--accent)}
.bars .labels .mgv{display:block;color:var(--accent);font-weight:700;min-height:16px}
.bar .ca{background:var(--accent-soft);border-radius:4px 4px 0 0;position:relative;min-height:2px}
.bar .mg{position:absolute;left:0;right:0;bottom:0;background:var(--accent);border-radius:0}
.bar.sel .ca{outline:2px solid var(--accent);outline-offset:1px}
.bars .labels{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:6px;font-size:12px;color:var(--muted);text-align:center}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.lrow{display:grid;grid-template-columns:1fr auto;gap:10px;padding:10px 12px;border-top:1px solid var(--line);align-items:center}
.lrow:first-child{border-top:0}
.lrow .info{min-width:0}

/* Feuille modale */
.sheet{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center;background:var(--shade)}
.sheet{overscroll-behavior:contain}
.sheet .panel{background:var(--surface);width:100%;max-width:640px;max-height:92%;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;border-radius:16px 16px 0 0;padding-block:16px calc(20px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
@media (prefers-reduced-motion:no-preference){.sheet .panel{animation:up .22s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
.panel-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.panel-h h2{font-family:var(--f-display);font-size:24px;margin:0;text-transform:uppercase;line-height:1.1;overflow-wrap:anywhere}
.close{width:40px;height:40px;border-radius:20px;border:0;background:var(--bg);font-size:22px;line-height:1;flex:none}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.flabel{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.field input,.field textarea{height:46px;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:0 12px;min-width:0;width:100%}
.field textarea{height:auto;min-height:70px;padding:10px 12px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{height:44px;border:0;border-left:1px solid var(--line);background:var(--bg);font-weight:600}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.chips.sub{margin-top:6px}
.chips.sub .chip{height:30px;font-size:13px}
.mtags{display:flex;gap:6px;flex-wrap:wrap}
.tagrupt{font-size:12px;font-weight:600;color:var(--warn);background:var(--warn-bg);padding:2px 8px;border-radius:10px;white-space:nowrap}
.lnk{border:0;background:none;color:var(--accent);font-weight:600;font-size:13px;padding:4px 0;text-align:left}
.tbtn{border:0;background:none;color:var(--tag);font-weight:700;text-decoration:underline;text-underline-offset:3px;padding:6px 2px;margin-left:4px;font-size:inherit}
.tlink,.nlink{border:0;background:none;padding:0;margin:0;text-align:left;font:inherit;color:inherit;cursor:pointer;display:block}
.nlink{font-weight:600;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px;overflow-wrap:anywhere}
.citem.rupt .nom{color:var(--muted)}
.photo{display:grid;grid-template-columns:96px 1fr;gap:12px;align-items:center}
.photo .thumb{width:96px;height:96px}
.photo .acts{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.photo label.btn{height:42px}
.bigphoto{width:100%;max-height:300px;object-fit:contain;border-radius:12px;background:var(--bg)}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.fact{background:var(--bg);border-radius:10px;padding:10px}
.fact span{display:block;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.fact b{font-family:var(--f-display);font-size:22px;font-weight:700}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.box{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}
.confirm{background:var(--bad-bg);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:500;max-width:calc(100% - 32px);text-align:center}
.result{background:var(--accent-soft);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px}
.result h3{margin:0;font-family:var(--f-display);font-size:22px;text-transform:uppercase}
.muted{color:var(--muted)}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none;left:0;top:0}
.photo .acts .btn{height:42px;padding:0 14px}
.locbox{border:1px dashed var(--line);border-radius:12px;background:var(--bg);min-height:120px;display:grid;place-items:center;overflow:hidden;color:var(--muted);font-size:14px}
.locbox img{width:100%;max-height:260px;object-fit:contain;display:block}
.zoom{border:0;padding:0;background:none;display:block;width:100%}
/* Éditeur et visionneuse : toujours sombres, comme un écran d'appareil photo */
.editor,.lightbox{--ed-bg:#0D110F;--ed-fg:#F1F4F2;--ed-btn:#242B28;--ed-hi:#FFD60A;--ed-hi-ink:#1B1600}
.editor{position:fixed;inset:0;z-index:40;background:var(--ed-bg);color:var(--ed-fg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.ed-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-block:10px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.ed-bar.tools{justify-content:center;flex-wrap:wrap}
.ed-title{font-weight:600;font-size:15px;text-align:center;min-width:0}
.ed-btn{height:44px;padding:0 14px;border-radius:10px;border:0;background:var(--ed-btn);color:var(--ed-fg);font-weight:600}
.ed-btn[aria-pressed="true"],.ed-btn.ok{background:var(--ed-hi);color:var(--ed-hi-ink)}
.ed-btn:disabled{opacity:.4}
.ed-stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:8px}
.ed-stage canvas{max-width:100%;max-height:100%;touch-action:none;border-radius:6px}
.lightbox{position:fixed;inset:0;z-index:35;background:var(--ed-bg);color:var(--ed-fg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:max(12px,env(safe-area-inset-top,0px)) 12px max(12px,env(safe-area-inset-bottom,0px))}
.lightbox img{max-width:100%;max-height:calc(100% - 40px);object-fit:contain}
.lightbox span{font-size:13px;opacity:.7}
.mmhint{font-size:13px;color:var(--accent);font-weight:600;min-height:18px;font-variant-numeric:tabular-nums}
.noprice{font-size:13px;font-weight:600;color:var(--warn);white-space:nowrap}
.unk{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);min-height:32px;cursor:pointer}
.unk input{width:18px;height:18px;accent-color:var(--accent)}
.field input:disabled{opacity:.45}
.sold-box{border-color:var(--accent);background:var(--accent-soft)}
.sold-box .flabel{color:var(--accent)}
.sold-box .field input,.sold-box .step input{background:var(--surface)}
.paste{height:40px;border:1px dashed var(--line);border-radius:10px;background:var(--bg);padding:0 12px;font-size:14px;width:100%;max-width:320px;caret-color:transparent}
.paste:focus{border-color:var(--accent)}
.pick{position:relative;overflow:hidden;cursor:pointer}
.pick input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:100px}
.pick:focus-within{outline:2px solid var(--accent);outline-offset:2px}
/* Appros : date, factures, historique */
.dinput{height:46px;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:0 12px;width:100%;max-width:240px;font-size:16px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.fwrap{position:relative}
.fthumb{display:block;width:100%;aspect-ratio:3/4;border:1px solid var(--line);border-radius:8px;overflow:hidden;padding:0;background:var(--bg)}
.fthumb img{width:100%;height:100%;object-fit:cover;display:block}
.fdel{position:absolute;top:4px;right:4px;width:32px;height:32px;border-radius:16px;border:0;background:rgba(0,0,0,.62);color:#fff;font-size:18px;font-weight:600;line-height:1}
.fdel.armed{background:var(--bad);color:#fff}
.hrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:12px;border:0;border-top:1px solid var(--line);background:none;text-align:left;width:100%}
.hrow:first-child{border-top:0}
.hrow .info{min-width:0;display:flex;flex-direction:column;gap:4px}
.hrow .d{font-weight:600}
.hrow .d::first-letter{text-transform:uppercase}
.aline{display:flex;gap:10px;align-items:center;min-width:0}
button.kpi{width:100%;text-align:left;cursor:pointer}
.prixbox{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.prixbox summary{list-style:none;cursor:pointer;padding:14px 12px;display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:600}
.prixbox summary::-webkit-details-marker{display:none}
.prixbox summary::after{content:"›";font-size:22px;line-height:1;color:var(--muted);transform:rotate(90deg);transition:transform .15s}
.prixbox[open] summary::after{transform:rotate(-90deg)}
.prow{display:flex;flex-direction:column;gap:8px;padding:12px;border-top:1px solid var(--line)}
.prow .row2 .field input{height:42px;font-size:15px;background:var(--bg)}
.prow .field input.miss{border-color:var(--warn);background:var(--warn-bg)}
.prow .field label{font-size:12px}
.kpi small{display:block;font-size:12px;color:var(--accent);font-weight:600;margin-top:4px}
</style>

    <button type="button" data-tab="bilan">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Bilan</button>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="supabase-adapter.js"></script>
<script>
(function(){
const $=s=>document.querySelector(s);
const view=$('#view');
let db=null, assets=null, downloads=null, produits=[], mouvements=[], courses=[], appros=[], treso=[], loaded=false;
let detId=null, venteOpen=false, tab='stock', filtre='tout', sousFiltre='', cSearch='', q='', moisSel=null, lastResult=null, approDate=todayKey(), apSheet=null;
let counts={};
try{counts=JSON.parse(localStorage.getItem('comptage')||'{}')||{}}catch(e){counts={}}
const saveCounts=()=>{try{localStorage.setItem('comptage',JSON.stringify(counts))}catch(e){}};

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
const nf=new Intl.NumberFormat('fr-FR',{minimumFractionDigits:3,maximumFractionDigits:3});
const nfi=new Intl.NumberFormat('fr-FR',{maximumFractionDigits:0});
/* Tous les prix sont stockés et saisis en millimes (10500 = 10,500 DT) */
const dt=n=>nf.format((n||0)/1000)+' DT';
const num=v=>{const n=parseFloat(String(v??'').replace(',','.'));return isNaN(n)?0:n};
const int=v=>{const n=parseInt(String(v??'').trim(),10);return isNaN(n)?null:n};
const pn=v=>{const s=String(v??'').replace(/\s/g,'');if(!s)return null;
  if(/[.,]/.test(s)){const d=parseFloat(s.replace(',','.'));return isNaN(d)?null:Math.round(d*1000)} // virgule tapée = dinars, converti
  const n=parseInt(s.replace(/\D/g,''),10);return isNaN(n)?null:n};
document.addEventListener('input',e=>{const i=e.target;if(!i.classList||!i.classList.contains('mm'))return;const h=i.closest('.field')&&i.closest('.field').querySelector('.mmhint');if(h){const v=pn(i.value);h.textContent=v===null?'':'= '+dt(v)}});
const mmHint=v=>`<span class="mmhint">${known(v)?'= '+dt(v):''}</span>`;
const known=v=>typeof v==='number'&&isFinite(v);
const pf=v=>known(v)?nf.format(v/1000):'?';
/* Coût réel d'une pièce : prix d'achat après la remise du dernier appro, sinon prix tarif */
const cout=p=>known(p.coutNet)?p.coutNet:(known(p.prixAchat)?p.prixAchat:null);
const incomplet=p=>!known(p.prixVente)||!known(p.prixAchat);
const CAT={velo:'Vélo',moto:'Moto',autre:'Autre'};
/* Sous-catégories moto : une pièce peut aller sur plusieurs types */
const MOTO={mobylette:'Mobylette',peugeot:'Peugeot',vespa:'Vespa'};
const modeles=p=>(p&&p.categorie==='moto'&&Array.isArray(p.modeles))?p.modeles.filter(k=>MOTO[k]):[];
const catLabel=p=>(CAT[p.categorie]||'')+(modeles(p).length?' · '+modeles(p).map(k=>MOTO[k]).join(', '):'');
/* Recherche par mots-clés : chaque mot tapé est cherché séparément, dans n'importe quel ordre,
   avec tolérance aux pluriels et aux petites fautes (« pneus », « chaine », « manivele »…) */
const words=t=>norm(t).replace(/[^a-z0-9]+/g,' ').trim().split(' ').filter(Boolean);
const stem=w=>w.length>4?w.replace(/(es|s|x)$/,''):w;
function lev(a,b,max){
  if(Math.abs(a.length-b.length)>max) return max+1;
  const d=[]; for(let j=0;j<=b.length;j++) d[j]=j;
  for(let i=1;i<=a.length;i++){let prev=d[0],mn=i;d[0]=i;
    for(let j=1;j<=b.length;j++){const t=d[j];d[j]=Math.min(d[j]+1,d[j-1]+1,prev+(a[i-1]===b[j-1]?0:1));prev=t;if(d[j]<mn)mn=d[j]}
    if(mn>max) return max+1}
  return d[b.length];
}
function tokScore(t,full,ws){
  if(/^\d+$/.test(t)) return ws.some(w=>w.startsWith(t))?3:0;      // nombres : 26 trouve « 26 », « 26x1 »
  if(full.includes(t)) return 3;                                     // morceau de mot : « arr » trouve « arrière »
  const st=stem(t);
  if(st.length>=3&&ws.some(w=>stem(w)===st||w.startsWith(st))) return 2;  // pluriels
  if(t.length>=4){const mx=t.length>=7?2:1;                          // petites fautes de frappe
    if(ws.some(w=>lev(stem(w),st,mx)<=mx||(w.length>t.length&&lev(w.slice(0,t.length),t,mx)<=mx))) return 1}
  return 0;
}
const txtP=p=>p.nom+' '+(p.emplacement||'')+' '+(p.notes||'')+' '+catLabel(p);
function cherche(list,q,txt){
  const ts=words(q); if(!ts.length) return {items:list,exact:true};
  const sc=list.map(p=>{const ws=words(txt(p)),full=ws.join(' '),nw=words(p.nom||'');let n=0,s=0;
    ts.forEach(t=>{const v=tokScore(t,full,ws);if(v){n++;s+=v;if(tokScore(t,nw.join(' '),nw))s+=2}});   // bonus si le mot est dans le nom
    if(nw[0]&&nw[0].startsWith(ts[0]))s+=1;
    return {p,n,s}});
  const all=sc.filter(x=>x.n===ts.length);
  const pick=all.length?all:sc.filter(x=>x.n>0&&x.n>=Math.ceil(ts.length/2));
  pick.sort((a,b)=>b.n-a.n||b.s-a.s||norm(a.p.nom).localeCompare(norm(b.p.nom)));
  return {items:pick.map(x=>x.p),exact:all.length>0};
}
const pic=p=>(p&&p.photoData)||(p&&p.photo?window.BLOB_BASE+p.photo:'');
const ICON='<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="6" cy="16" r="4"/><circle cx="18" cy="16" r="4"/><path d="M6 16l4-8h5l3 8M10 8l2 8h-6M14 5h3"/></svg>';
const thumb=(p,cls='')=>`<div class="thumb ${cls}">${pic(p)?`<img src="${esc(pic(p))}" alt="" loading="lazy" onerror="this.remove()">`:ICON}</div>`;
const locSrc=p=>(p&&p.emplacementPhotoData)||(p&&p.emplacementPhoto?window.BLOB_BASE+p.emplacementPhoto:'');
const locTag=p=>p.emplacement?binTag(p.emplacement):(locSrc(p)?`<span class="bin">voir photo</span>`:binTag(''));
const binTag=e=>e?`<span class="bin">${esc(e)}</span>`:`<span class="bin vide">sans place</span>`;
/* Pièces liées (« se vend avec ») : le lien vaut dans les deux sens */
const liesDe=p=>{if(!p)return[];const ids=new Set(p.lies||[]);produits.forEach(x=>{if((x.lies||[]).includes(p.id))ids.add(x.id)});ids.delete(p.id);return [...ids].map(id=>produits.find(x=>x.id===id)).filter(Boolean)};
const lieChip=x=>{const [c,l]=etat(x);return `<button type="button" class="lie" data-lie="${esc(x.id)}">${thumb(x,'xs')}<span class="lnom">${esc(x.nom)}</span><span class="qty ${c}">${esc(l)}</span></button>`};
const etat=p=>{const s=p.stock||0, m=p.seuil||0; if(s<=0) return ['out','Épuisé']; if(s<=m) return ['low',s+' en stock']; return ['',s+' en stock'];};
const moisKey=iso=>String(iso||'').slice(0,7);
const nowKey=()=>new Date().toISOString().slice(0,7);
const moisLabel=(k,opt={month:'long',year:'numeric'})=>{const [y,m]=k.split('-').map(Number);return new Date(y,m-1,1).toLocaleDateString('fr-FR',opt)};
/* Jours en heure locale (AAAA-MM-JJ) : un appro = tous les achats d'un même jour */
function dayKey(iso){const d=new Date(iso);if(isNaN(d))return '';return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function todayKey(){return dayKey(new Date().toISOString())}
const isoOf=k=>k===todayKey()?new Date().toISOString():new Date(k+'T12:00:00').toISOString();
const dayLabel=k=>new Date(k+'T12:00:00').toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
const achatsDu=k=>mouvements.filter(m=>m.type==='achat'&&dayKey(m.date)===k);
const remiseDu=k=>{const a=appros.find(x=>x.id===k);return a&&known(a.remise)&&a.remise>0?a.remise:0};
const remisesMois=mk=>appros.reduce((s,a)=>s+(a.id.slice(0,7)===mk&&known(a.remise)?a.remise:0),0);
const dinars=v=>{const t=String(v??'').replace(/\s/g,'').replace(',','.');if(!t)return null;const n=parseFloat(t);return isNaN(n)||n<0?null:Math.round(n*1000)};

/* Bulle de confirmation, avec un lien d'action facultatif (ex. « Voir la fiche ») */
let tt; function toast(msg,act){const t=$('#toast');t.textContent=msg;
  if(act){const b=document.createElement('button');b.type='button';b.className='tbtn';b.textContent=act.label;b.onclick=()=>{t.hidden=true;act.fn()};t.append(' ',b)}
  t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,act?5000:2600)}

/* ---------- Onglets ---------- */
document.querySelectorAll('nav.tabs button').forEach(b=>b.addEventListener('click',()=>{
  resetOverlays();
  tab=b.dataset.tab;
  document.querySelectorAll('nav.tabs button').forEach(x=>{if(x===b)x.setAttribute('aria-current','page');else x.removeAttribute('aria-current')});
  render(); window.scrollTo(0,0);
}));
$('#q').addEventListener('input',e=>{q=e.target.value;render()});
$('#fab').addEventListener('click',()=>openForm(null));

function renderChips(){
  const low=produits.filter(p=>!p.arrete&&(p.stock||0)<=(p.seuil||0)).length, nArr=produits.filter(p=>p.arrete).length;
  const sansPrix=produits.filter(incomplet).length;
  const opts=[['tout','Tout ('+produits.length+')'],['velo','Vélo'],['moto','Moto'],['racheter','À racheter ('+low+')']];
  if(sansPrix||filtre==='prix') opts.push(['prix','Prix manquant ('+sansPrix+')']);
  if(nArr||filtre==='arrete') opts.push(['arrete','Plus dispo ('+nArr+')']);
  $('#chips').innerHTML=opts.map(([k,l])=>`<button class="chip" type="button" data-f="${k}" aria-pressed="${filtre===k}">${esc(l)}</button>`).join('');
  $('#chips').querySelectorAll('button').forEach(b=>b.onclick=()=>{filtre=b.dataset.f;if(filtre!=='moto')sousFiltre='';render()});
  let sub=$('#subchips'); if(!sub){sub=document.createElement('div');sub.id='subchips';sub.className='chips sub';$('#chips').after(sub)}
  if(filtre==='moto'){const mp=produits.filter(p=>p.categorie==='moto');
    const so=[['','Toutes ('+mp.length+')'],...Object.entries(MOTO).map(([k,l])=>[k,l+' ('+mp.filter(p=>!modeles(p).length||modeles(p).includes(k)).length+')'])];
    sub.innerHTML=so.map(([k,l])=>`<button class="chip" type="button" data-s="${k}" aria-pressed="${sousFiltre===k}">${esc(l)}</button>`).join('');
    sub.hidden=false; sub.querySelectorAll('button').forEach(b=>b.onclick=()=>{sousFiltre=b.dataset.s;render()});
  } else {sub.hidden=true;sub.innerHTML=''}
}

function render(){
  $('#searchbox').hidden = tab!=='stock';
  $('#fab').hidden = tab!=='stock' || !db;
  if(!db){view.innerHTML=`<div class="empty"><h2>Appli hors ligne</h2><p>Vérifie ta connexion internet puis recharge la page.</p></div>`;return}
  if(!loaded){view.innerHTML=`<div class="empty"><p>Chargement du stock…</p></div>`;return}
  try{
    if(tab==='stock') renderStock(); else if(tab==='vente') renderVente(); else if(tab==='courses') renderCourses(); else if(tab==='comptage') renderComptage(); else renderBilan();
  }catch(e){
    console.error(e);
    view.innerHTML=`<div class="empty"><h2>Petit souci d'affichage</h2><p>Les données sont en sécurité. Change d'onglet ou recharge la page.</p><button class="btn" type="button" id="retry">Réessayer</button></div>`;
    $('#retry').onclick=render;
  }
}

/* ---------- Stock ---------- */
function renderStock(){
  renderChips();
  const ex=produits.filter(p=>p.exemple);
  let html='';
  if(ex.length) html+=`<div class="banner"><span>${ex.length} pièce${ex.length>1?'s':''} d'exemple pour voir comment ça marche.</span><button type="button" id="delEx">Supprimer les exemples</button></div>`;
  if(!produits.length){
    view.innerHTML=html+`<div class="empty"><h2>Aucune pièce</h2><p>Commence le premier inventaire avec ton grand-père, étagère par étagère.</p>
      <ol class="steps"><li>Donne un nom à chaque emplacement (A1, B2…).</li><li>Pour chaque pièce : photo, nom, prix, quantité.</li><li>Ensuite, recompte une fois par mois dans l'onglet Comptage.</li></ol>
      <button class="btn primary" type="button" id="first">Ajouter la première pièce</button></div>`;
    $('#first').onclick=()=>openForm(null); bindEx(); return;
  }
  let list=produits.filter(p=>{
    if(filtre==='velo'||filtre==='moto') if(p.categorie!==filtre) return false;
    if(filtre==='moto'&&sousFiltre){const m=modeles(p);if(m.length&&!m.includes(sousFiltre)) return false}   // type choisi + pièces communes à toutes les motos
    if(filtre==='racheter' && (p.arrete||(p.stock||0)>(p.seuil||0))) return false;
    if(filtre==='arrete' && !p.arrete) return false;
    if(filtre==='prix' && !incomplet(p)) return false;
    return true;
  }).sort((a,b)=>norm(a.nom).localeCompare(norm(b.nom)));
  let approx=false; if(q.trim()){const r=cherche(list,q,txtP);list=r.items;approx=!r.exact}
  if(!list.length){view.innerHTML=html+`<div class="empty"><p>Rien ne correspond${q?' à « '+esc(q)+' »':''}.</p></div>`;bindEx();return}
  if(approx) html+=`<p class="hint">Aucune pièce ne contient tous ces mots. Voici celles qui s'en rapprochent :</p>`;
  html+=`<div class="list">`+list.map(p=>{const [c,l]=etat(p);return `<button class="item" type="button" data-id="${esc(p.id)}">${thumb(p)}
    <div class="info"><div class="nom">${esc(p.nom)}</div><div class="meta">${locTag(p)}<span>${esc(catLabel(p))}</span>${p.arrete?'<span class="tagrupt">Plus dispo</span>':''}${p.exemple?'<span>· exemple</span>':''}</div></div>
    <div class="right">${known(p.prixVente)?`<div class="prix num">${dt(p.prixVente)}</div>`:`<div class="noprice">Prix de vente ?</div>`}<div class="qty num ${c}">${esc(l)}</div></div></button>`}).join('')+`</div>`;
  view.innerHTML=html;
  view.querySelectorAll('.item').forEach(b=>b.onclick=()=>openDetail(b.dataset.id));
  bindEx();
}
function bindEx(){const b=$('#delEx'); if(!b) return; b.onclick=async()=>{b.disabled=true;try{for(const p of produits.filter(x=>x.exemple)){await db.doc('produits/'+p.id).delete()}toast('Exemples supprimés')}catch(e){toast("Suppression impossible, réessaie.");b.disabled=false}}}

/* ---------- Feuille ---------- */
/* Pas de blocage du défilement de la page : sur téléphone, ça peut rester coincé après fermeture */
function openSheet(html){apSheet=null;detId=null;blurActive();const s=$('#sheet');$('#panel').innerHTML=html;s.hidden=false;$('#panel').scrollTop=0;const c=$('#panel .close');if(c)c.onclick=closeSheet}
/* Fiche ouverte : le stock affiché suit les changements (vente, réappro…) sans fermer la fiche */
function refreshDetail(){
  if(!detId||$('#sheet').hidden) return;
  const p=produits.find(x=>x.id===detId), el=$('#dqty'); if(!p||!el) return;
  const [c,l]=etat(p); el.className='qty '+c; el.textContent=l;
}
function closeSheet(){apSheet=null;blurActive();$('#sheet').hidden=true;unstick()}
function blurActive(){const a=document.activeElement;if(a&&a!==document.body&&a.blur)a.blur()}
/* Remet la page d'aplomb : rien ne doit rester par-dessus, et le défilement doit marcher */
function unstick(){
  document.body.style.overflow='';document.documentElement.style.overflow='';
  if($('#sheet').hidden) $('#panel').innerHTML='';
  // Après la fermeture du clavier, certains téléphones décalent la zone tactile : un petit défilement la recale
  requestAnimationFrame(()=>window.scrollTo(window.scrollX,window.scrollY));
}
function resetOverlays(){
  blurActive();
  $('#sheet').hidden=true;$('#lightbox').hidden=true;
  if(!$('#editor').hidden) $('#edCancel').click();
  document.querySelectorAll('.sug').forEach(s=>s.hidden=true);
  unstick();
}
document.addEventListener('focusout',e=>{if(e.target&&e.target.matches&&e.target.matches('input,textarea'))setTimeout(()=>{if(!document.activeElement||!document.activeElement.matches('input,textarea'))window.scrollTo(window.scrollX,window.scrollY)},120)});
window.addEventListener('pageshow',unstick);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)unstick()});
$('#sheet').addEventListener('click',e=>{if(e.target.id==='sheet')closeSheet()});
document.addEventListener('keydown',e=>{if(e.key!=='Escape')return;if(!$('#lightbox').hidden){$('#lightbox').hidden=true;return}if(!$('#editor').hidden){$('#edCancel').click();return}if(!$('#sheet').hidden)closeSheet()});
$('#lightbox').addEventListener('click',()=>{$('#lightbox').hidden=true});

/* ---------- Formulaire ---------- */
async function decode(file){
  if(window.createImageBitmap){try{const b=await createImageBitmap(file);return{src:b,w:b.width,h:b.height}}catch(e){}}
  const url=URL.createObjectURL(file);
  try{const i=await new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=url});return{src:i,w:i.naturalWidth,h:i.naturalHeight}}
  finally{setTimeout(()=>URL.revokeObjectURL(url),1000)}
}
async function toBlobScaled(src,w,h,max=1000,quality=.8){
  const r=Math.min(1,max/Math.max(w,h));
  const c=document.createElement('canvas');c.width=Math.max(1,Math.round(w*r));c.height=Math.max(1,Math.round(h*r));
  c.getContext('2d').drawImage(src,0,0,c.width,c.height);
  const b=await new Promise(res=>c.toBlob(res,'image/jpeg',quality));
  if(!b) throw new Error('toBlob');
  return b;
}
async function compress(file,max=1000,quality=.8){const im=await decode(file);return toBlobScaled(im.src,im.w,im.h,max,quality)}
/* Enregistre une image : stockage normal, sinon petite version dans la fiche */
async function storeImage(blob,smaller){
  let err='envoi';
  if(!assets){try{assets=await window.claude.use('assets')}catch(e){}}
  if(assets){try{const r=await assets.upload(blob,{type:'image/jpeg'});return{id:r.id,url:r.url}}catch(e){err=(e&&e.code)||err}}
  try{
    let data=await toDataURL(await smaller(640,.7));
    if(data.length>180000) data=await toDataURL(await smaller(420,.6));
    if(data.length<=180000) return{data,url:data};
  }catch(e){}
  throw new Error(err);
}

/* Éditeur : flèches et cercles sur la photo d'emplacement */
function openEditor(srcBlob){
  return new Promise(async (resolve,reject)=>{
    let im; try{im=await decode(srcBlob)}catch(e){reject(new Error('lecture'));return}
    const ed=$('#editor'), cv=$('#edCanvas'), ctx=cv.getContext('2d');
    const r=Math.min(1,1400/Math.max(im.w,im.h)); cv.width=Math.round(im.w*r); cv.height=Math.round(im.h*r);
    const shapes=[]; let tool='arrow', cur=null; const lw=Math.max(5,Math.max(cv.width,cv.height)/110);
    const draw=s=>{ctx.lineCap='round';ctx.lineJoin='round';
      for(const [col,w] of [['rgba(0,0,0,.7)',lw*1.9],['#FFD60A',lw]]){ctx.strokeStyle=col;ctx.lineWidth=w;ctx.beginPath();
        if(s.t==='arrow'){const a=Math.atan2(s.y2-s.y1,s.x2-s.x1),h=lw*4.5;ctx.moveTo(s.x1,s.y1);ctx.lineTo(s.x2,s.y2);ctx.moveTo(s.x2-h*Math.cos(a-.5),s.y2-h*Math.sin(a-.5));ctx.lineTo(s.x2,s.y2);ctx.lineTo(s.x2-h*Math.cos(a+.5),s.y2-h*Math.sin(a+.5))}
        else{ctx.ellipse((s.x1+s.x2)/2,(s.y1+s.y2)/2,Math.max(4,Math.abs(s.x2-s.x1)/2),Math.max(4,Math.abs(s.y2-s.y1)/2),0,0,Math.PI*2)}
        ctx.stroke()}};
    const redraw=()=>{ctx.drawImage(im.src,0,0,cv.width,cv.height);shapes.forEach(draw);if(cur)draw(cur)};
    const updUndo=()=>{$('#edUndo').disabled=!shapes.length};
    const pt=e=>{const b=cv.getBoundingClientRect();return{x:(e.clientX-b.left)*cv.width/b.width,y:(e.clientY-b.top)*cv.height/b.height}};
    cv.onpointerdown=e=>{e.preventDefault();try{cv.setPointerCapture(e.pointerId)}catch(x){}const p=pt(e);cur={t:tool,x1:p.x,y1:p.y,x2:p.x,y2:p.y};redraw()};
    cv.onpointermove=e=>{if(!cur)return;const p=pt(e);cur.x2=p.x;cur.y2=p.y;redraw()};
    cv.onpointerup=cv.onpointercancel=()=>{if(!cur)return;if(Math.hypot(cur.x2-cur.x1,cur.y2-cur.y1)>lw*2)shapes.push(cur);cur=null;redraw();updUndo()};
    ed.querySelectorAll('[data-tool]').forEach(b=>{b.setAttribute('aria-pressed',b.dataset.tool===tool);b.onclick=()=>{tool=b.dataset.tool;ed.querySelectorAll('[data-tool]').forEach(x=>x.setAttribute('aria-pressed',x===b))}});
    $('#edUndo').onclick=()=>{shapes.pop();redraw();updUndo()};
    const done=v=>{ed.hidden=true;window.removeEventListener('resize',fit);cv.onpointerdown=cv.onpointermove=cv.onpointerup=cv.onpointercancel=null;resolve(v)};
    $('#edCancel').onclick=()=>done(null);
    $('#edOk').onclick=()=>done(cv);
    const fit=()=>{const st=ed.querySelector('.ed-stage').getBoundingClientRect();const s=Math.min((st.width-16)/cv.width,(st.height-16)/cv.height,1);cv.style.width=Math.floor(cv.width*s)+'px';cv.style.height=Math.floor(cv.height*s)+'px'};
    ed.hidden=false; fit(); window.addEventListener('resize',fit); redraw(); updUndo();  });
}
const toDataURL=blob=>new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=rej;fr.readAsDataURL(blob)});

function priceField(id,label,v){
  const unknown=v!==undefined&&!known(v);
  return `<div class="field"><label for="${id}">${label}</label><input id="${id}" class="mm" inputmode="numeric" value="${known(v)?esc(String(v)):''}" placeholder="ex. 10500" ${unknown?'disabled':''}>${mmHint(v)}
    <label class="unk"><input type="checkbox" id="${id}-x" ${unknown?'checked':''}> Je ne connais pas</label></div>`;
}
/* Une photo peut servir à plusieurs pièces (copies) : on ne l'efface que si plus aucune autre fiche ne l'utilise */
async function dropAsset(aid,exceptId){
  if(!aid||!assets) return;
  if(produits.some(x=>x.id!==exceptId&&(x.photo===aid||x.emplacementPhoto===aid))) return;
  try{await assets.delete(aid)}catch(e){}
}

function renderComptage(){
  let html='';

    html+=`<div class="result"><h3>Comptage enregistré</h3>
      <div>${r.pieces} pièce${r.pieces>1?'s':''} vendue${r.pieces>1?'s':''} depuis le dernier comptage.</div>
      <div class="kpis"><div class="kpi"><span>Chiffre d'affaires</span><b class="num">${dt(r.ca)}</b></div><div class="kpi"><span>Marge</span><b class="num">${dt(r.marge)}</b></div></div>
      ${r.sansPrix&&r.sansPrix.length?`<div class="hint">Vendu sans prix complet (pas compté dans la marge) : ${r.sansPrix.map(esc).join(', ')}. Complète les prix dans leur fiche.</div>`:''}
      ${r.plus.length?`<div class="hint">Trouvé en plus que prévu : ${r.plus.map(esc).join(', ')}. Peut-être un réappro non noté.</div>`:''}
      ${r.racheter.length?`<div><b>À racheter :</b> ${r.racheter.map(esc).join(', ')}</div>`:''}
      <button class="btn" type="button" id="rclose">Fermer</button></div>`;
  }
  if(!produits.length){view.innerHTML=html+`<div class="empty"><h2>Rien à compter</h2><p>Ajoute d'abord tes pièces dans l'onglet Stock.</p></div>`;bindR();return}
  html+=`<p class="hint">Compte ce qu'il reste sur chaque emplacement et tape le nombre. Laisse vide ce que tu ne comptes pas. L'appli déduit ce qui a été vendu, en tenant compte des réappros et des ventes déjà notées depuis la fiche des pièces.</p>`;
  const list=[...produits].sort((a,b)=>(a.emplacement||'~').localeCompare(b.emplacement||'~',undefined,{numeric:true})||norm(a.nom).localeCompare(norm(b.nom)));
  let curEmp=null, rows='';
  html+=`<div class="search" style="margin:0"><input id="cqs" type="search" placeholder="Chercher une pièce à compter…" autocomplete="off" value="${esc(cSearch)}" aria-label="Chercher une pièce à compter"></div><p class="hint" id="cqn" hidden></p>`;
  html+=`<div class="list" id="clistc">`+list.map(p=>{
    const v=counts[p.id]??'';
    return `<div class="crow" data-row="${esc(p.id)}">${thumb(p,'sm')}<div class="info"><div class="nom" style="font-weight:600;overflow-wrap:anywhere">${esc(p.nom)}</div>
      <div class="meta">${locTag(p)}<span class="num">Prévu : ${p.stock||0}</span><span class="diff" id="d-${esc(p.id)}">${diffText(p,v)}</span></div></div>
      <input type="text" inputmode="numeric" id="c-${esc(p.id)}" data-id="${esc(p.id)}" value="${esc(v)}" placeholder="–" aria-label="Quantité comptée pour ${esc(p.nom)}"></div>`}).join('')+`</div>`;
  html+=`<div style="height:70px"></div><div class="stickybar"><div class="wrap"><button class="btn primary block" type="button" id="csave"></button></div></div>`;
  view.innerHTML=html; bindR();
  view.querySelectorAll('.crow input').forEach(i=>i.addEventListener('input',()=>{
    const id=i.dataset.id; const v=i.value.replace(/[^\d]/g,''); if(v!==i.value) i.value=v;
    if(v==='') delete counts[id]; else counts[id]=v; saveCounts();
    const p=produits.find(x=>x.id===id); const d=document.getElementById('d-'+id); if(d&&p){d.className='diff '+diffClass(p,v);d.textContent=diffText(p,v)}
    updSave();
  }));
  $('#csave').onclick=saveComptage; updSave();
  /* Recherche : masque les lignes sans les effacer, les quantités déjà tapées restent */
  const filt=()=>{const box=$('#clistc'),info=$('#cqn');if(!box)return;
    if(!cSearch.trim()){box.querySelectorAll('.crow').forEach(r=>r.hidden=false);info.hidden=true;return}
    const r=cherche(produits,cSearch,txtP), ok=new Set(r.items.map(p=>p.id));
    box.querySelectorAll('.crow').forEach(row=>row.hidden=!ok.has(row.dataset.row));
    info.hidden=false;info.textContent=ok.size?(ok.size+' pièce'+(ok.size>1?'s':'')+(r.exact?'':' proches')+'. Les quantités déjà tapées pour les autres pièces sont gardées.'):'Aucune pièce ne correspond.'};
  $('#cqs').addEventListener('input',e=>{cSearch=e.target.value;filt()}); filt();
}
function bindR(){const b=$('#rclose'); if(b) b.onclick=()=>{lastResult=null;render()}}
function diffText(p,v){const n=int(v);if(n===null)return '';const d=(p.stock||0)-n;if(d>0)return '→ '+d+' vendu'+(d>1?'s':'');if(d<0)return '→ '+(-d)+' en plus';return '→ rien de vendu'}
function diffClass(p,v){const n=int(v);if(n===null)return '';const d=(p.stock||0)-n;return d>0?'sold':d<0?'plus':''}
function updSave(){const b=$('#csave');if(!b)return;const n=Object.keys(counts).filter(id=>produits.some(p=>p.id===id)).length;b.disabled=!n;b.textContent=n?`Enregistrer le comptage (${n} pièce${n>1?'s':''})`:'Tape au moins une quantité'}

async function saveComptage(){
  const b=$('#csave'); b.disabled=true; b.textContent='Enregistrement…';
  const now=new Date().toISOString(), cid='c'+Date.now();
  const r={pieces:0,ca:0,marge:0,plus:[],racheter:[],sansPrix:[]};
  try{
    for(const [id,v] of Object.entries(counts)){
      const p=produits.find(x=>x.id===id); const n=int(v); if(!p||n===null){delete counts[id];continue}
      const compte=Math.max(0,n), d=(p.stock||0)-compte;
      const pv=known(p.prixVente)?p.prixVente:null, pa=cout(p);
      if(d!==0) await db.collection('mouvements').add({type:d>0?'vente':'ecart',produitId:id,nom:p.nom,qte:Math.abs(d),prixAchat:pa,prixVente:pv,date:now,comptage:cid});
      await db.doc('produits/'+id).update({stock:compte,dernierComptage:now});
      if(d>0){r.pieces+=d;if(pv!==null)r.ca+=d*pv;if(pv!==null&&pa!==null)r.marge+=d*(pv-pa);else r.sansPrix.push(p.nom)}
      if(d<0) r.plus.push(p.nom);
      if(compte<=(p.seuil||0)) r.racheter.push(p.nom+' ('+compte+')');
      delete counts[id]; saveCounts();
    }
    lastResult=r; window.scrollTo(0,0); render();
  }catch(e){toast("Une partie n'a pas été enregistrée. Réessaie pour le reste.");render()}
}

let venteSel=null, sugIdx=0, sugList=[];
function renderVente(){

  view.innerHTML=`<div class="field"><label for="vq">Pièce vendue</label>
      <div class="combo"><input id="vq" type="search" autocomplete="off" placeholder="Tape le nom ou l'emplacement…" role="combobox" aria-expanded="false" aria-controls="vsug" aria-autocomplete="list">
      <div id="vsug" class="sug" role="listbox" hidden></div></div></div>
    <div id="vform"></div>
    <h3 class="section-h">Ventes du jour</h3><div id="vday"></div>`;
  const vq=$('#vq');
  vq.addEventListener('input',()=>{if(venteSel){venteSel=null;renderVForm()}showSug()});
  vq.addEventListener('focus',showSug);
  vq.addEventListener('keydown',e=>{
    if($('#vsug').hidden) return;
    if(e.key==='ArrowDown'){e.preventDefault();sugIdx=Math.min(sugList.length-1,sugIdx+1);paintSug()}

  /* Pièce déjà en stock : mise en stock directe, sans passer par la fiche */
  l.querySelectorAll('[data-stock]').forEach(b=>b.onclick=async()=>{
    const c=courses.find(x=>x.id===b.dataset.stock);const p=c&&prod(c);if(!p||c.stocke)return;

    b.disabled=true;b.textContent='Mise en stock…';

      await db.collection('mouvements').add({type:'achat',produitId:p.id,nom:p.nom,qte:c.qte,prixAchat:pa,prixVente:known(p.prixVente)?p.prixVente:null,date:isoOf(approDate)});
      await db.doc('produits/'+p.id).update({stock:(p.stock||0)+c.qte,...(pa!==null?{prixAchat:pa}:{}),coutNet:null});
      await db.doc('courses/'+c.id).update({stocke:true});
      toast('+'+c.qte+' '+p.nom+' mis en stock'+(pa===null?" (sans prix d'achat)":'')+'.',{label:'Voir la fiche',fn:()=>openDetail(p.id)});
    }catch(e){toast('Mise en stock impossible, réessaie.');if(b.isConnected){b.disabled=false;b.textContent='Mettre en stock (+'+c.qte+')'}}
  });
  const cl=$('#cclear'); if(cl) cl.onclick=async()=>{
    const pending=done.filter(c=>!c.stocke).length;
    if(!cl.classList.contains('armed')){cl.classList.add('armed','danger');cl.textContent=pending?`Confirmer ? ${pending} pièce${pending>1?'s':''} pas encore mise${pending>1?'s':''} en stock`:'Confirmer ?';setTimeout(()=>{if(cl.isConnected){cl.classList.remove('armed','danger');cl.textContent='Retirer les pièces prises de la liste'}},4000);return}
    cl.disabled=true;try{for(const c of done){await db.doc('courses/'+c.id).delete()}toast('Liste nettoyée')}catch(e){toast('Suppression impossible.');cl.disabled=false}
  };
}

const PHOTO_BAD="Ce format de photo n'est pas lu. Réglage appareil photo : choisis JPEG (« Le plus compatible » sur iPhone).";
const PHOTO_NOPICK="Rien ne s'est ouvert ? Ton navigateur bloque peut-être l'accès aux photos. Ouvre ce lien dans Chrome ou Safari, ou copie la photo depuis ta galerie et colle-la dans le champ ci-dessus.";
async function addFacture(file,k,st){
  if(!assets){try{assets=await window.claude.use('assets')}catch(e){}}
  if(!assets){st("Les photos ne sont pas disponibles ici.");return}
  st('Préparation de la photo…');
  let blob=null; try{blob=await compress(file,1800,.85)}catch(e){}   // assez grand pour relire la facture
  if(!blob){st(PHOTO_BAD);return}
  st('Envoi de la photo…');
  try{
    const r=await assets.upload(blob,{type:'image/jpeg'});
    const a=appros.find(x=>x.id===k);
    if(a) await db.doc('appros/'+k).update({factures:[...(a.factures||[]),r.id]});
    else await db.doc('appros/'+k).set({jour:k,factures:[r.id],cree:new Date().toISOString()});
    st(''); toast('Facture enregistrée');
  }catch(e){st("La photo n'a pas pu être enregistrée"+(e&&e.code==='quota_exceeded'?' (stockage plein).':'. Réessaie.'))}
}
const factureUI=pre=>`<div style="display:flex;gap:6px;flex-wrap:wrap"><label class="btn pick">Photo de la facture<input id="${pre}cam" type="file" accept="image/*" capture="environment" aria-label="Photographier la facture"></label><label class="btn pick">Galerie<input id="${pre}gal" type="file" accept="image/*" aria-label="Choisir une photo de facture"></label></div>

      setTimeout(()=>{window.removeEventListener('blur',on);document.removeEventListener('visibilitychange',on);if(!o)st(PHOTO_NOPICK)},1600)})});

/* ---------- Bilan ---------- */
function renderBilan(){
  const cur=nowKey();
  const keys=new Set([cur]); mouvements.forEach(m=>keys.add(moisKey(m.date)));
  const sorted=[...keys].filter(Boolean).sort();
  if(!moisSel||!keys.has(moisSel)) moisSel=cur;
  const idx=sorted.indexOf(moisSel);
  const stats=k=>{let ca=0,mg=0,caM=0,pc=0,ach=0,inc=0;mouvements.forEach(m=>{if(moisKey(m.date)!==k)return;const pv=known(m.prixVente),pa=known(m.prixAchat);if(m.type==='vente'){pc+=m.qte;if(pv)ca+=m.qte*m.prixVente;if(pv&&pa){mg+=m.qte*(m.prixVente-m.prixAchat);caM+=m.qte*m.prixVente}else inc+=m.qte}else if(m.type==='achat'&&pa){ach+=m.qte*m.prixAchat}});ach-=remisesMois(k);return{ca,mg,caM,pc,ach,inc}};
  const s=stats(moisSel);
  // 6 derniers mois jusqu'au mois choisi
  const [Y,M]=moisSel.split('-').map(Number); const six=[];
  for(let i=5;i>=0;i--){const d=new Date(Y,M-1-i,1);six.push(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'))}
  const st6=six.map(k=>({k,...stats(k)})); const max=Math.max(1,...st6.map(x=>x.ca));
  const valAchat=produits.reduce((a,p)=>a+(known(p.prixAchat)?(p.stock||0)*p.prixAchat:0),0);
  const valVente=produits.reduce((a,p)=>a+(known(p.prixVente)?(p.stock||0)*p.prixVente:0),0);
  const nSansPrix=produits.filter(incomplet).length;
  const agg={}; mouvements.filter(m=>m.type==='vente'&&moisKey(m.date)===moisSel).forEach(m=>{const a=agg[m.produitId]||(agg[m.produitId]={nom:m.nom,q:0,ca:null,mg:null});a.q+=m.qte;if(known(m.prixVente))a.ca=(a.ca||0)+m.qte*m.prixVente;if(known(m.prixVente)&&known(m.prixAchat))a.mg=(a.mg||0)+m.qte*(m.prixVente-m.prixAchat)});
  const top=Object.values(agg).sort((a,b)=>(b.mg??-1e9)-(a.mg??-1e9));
  const rach=produits.filter(p=>(p.stock||0)<=(p.seuil||0)).sort((a,b)=>(a.stock||0)-(b.stock||0));

  view.innerHTML=`${tresoHTML()}<div class="monthsel"><button class="iconbtn" type="button" id="mprev" aria-label="Mois précédent" ${idx<=0?'disabled':''}>‹</button><h2>${esc(moisLabel(moisSel))}</h2><button class="iconbtn" type="button" id="mnext" aria-label="Mois suivant" ${idx>=sorted.length-1?'disabled':''}>›</button></div>
    <div class="kpis"><div class="kpi hero"><span>Marge du mois</span><b class="num">${dt(s.mg)}</b></div>
      <div class="kpi"><span>Chiffre d'affaires</span><b class="num">${dt(s.ca)}</b></div><div class="kpi"><span>Pièces vendues</span><b class="num">${s.pc}</b></div>
      <button type="button" class="kpi" id="kach"><span>Achats fournisseur</span><b class="num">${dt(s.ach)}</b><small>Voir les appros ›</small></button><div class="kpi"><span>Marge moyenne</span><b class="num">${s.caM?Math.round(s.mg/s.caM*100)+' %':'–'}</b></div></div>
    <p class="hint">Les ventes sont datées du jour du comptage, pas du jour réel de la vente.${s.inc?` ${s.inc} pièce${s.inc>1?'s':''} vendue${s.inc>1?'s':''} sans prix complet : pas comptée${s.inc>1?'s':''} dans la marge.`:''}</p>
    <div class="bars"><div class="grid">${st6.map(x=>`<button type="button" class="bar ${x.k===moisSel?'sel':''}" data-mk="${x.k}" aria-label="${esc(moisLabel(x.k))} : chiffre d'affaires ${dt(x.ca)}, marge ${dt(x.mg)}"><span class="bv num">${x.ca?nfi.format(Math.round(x.ca/1000)):'–'}</span><div class="ca" style="height:${(x.ca/max*80).toFixed(1)}%"><div class="mg" style="height:${x.ca?Math.max(0,x.mg/x.ca*100).toFixed(1):0}%"></div></div></button>`).join('')}</div>
      <div class="labels">${st6.map(x=>`<span>${esc(moisLabel(x.k,{month:'short'}))}<b class="mgv num">${x.mg?nfi.format(Math.round(x.mg/1000)):''}</b></span>`).join('')}</div>
      <div class="legend"><span><i style="background:var(--accent-soft)"></i>Chiffre d'affaires (en haut)</span><span><i style="background:var(--accent)"></i>Marge (sous le mois)</span></div>
      <p class="hint" style="margin-top:6px">En dinars, arrondi. Touche un mois pour voir son détail.</p></div>
    <h3 class="section-h">Ventes du mois</h3>
    ${top.length?`<div class="list">${top.map(a=>`<div class="lrow"><div class="info"><div style="font-weight:600;overflow-wrap:anywhere">${esc(a.nom)}</div><div class="meta num">${a.q} vendu${a.q>1?'s':''} · ${a.ca===null?'prix de vente ?':dt(a.ca)}</div></div>${a.mg===null?`<div class="noprice">Marge ?</div>`:`<div class="prix num">+${pf(a.mg)}</div>`}</div>`).join('')}</div>`:`<div class="empty"><p>Pas encore de ventes ce mois-ci. Elles apparaissent après un comptage.</p></div>`}
    ${(()=>{const vm=mouvements.filter(m=>m.type==='vente'&&moisKey(m.date)===moisSel).sort((a,b)=>String(b.date).localeCompare(String(a.date)));
      return vm.length?`<details class="prixbox" id="vdet" ${venteOpen?'open':''}><summary><span>Détail des ventes (${vm.length}) <span class="muted" style="font-weight:500">· annuler une vente</span></span></summary>
      ${vm.map(m=>`<div class="lrow"><div class="info"><div style="font-weight:600;overflow-wrap:anywhere">${esc(m.nom||'Pièce')}</div>
        <div class="meta num">${esc(new Date(m.date).toLocaleDateString('fr-FR',{day:'numeric',month:'short'}))} · ${m.qte} × ${known(m.prixVente)?pf(m.prixVente):'prix ?'}${known(m.prixVente)?' = '+dt(m.qte*m.prixVente):''} · ${m.source==='manuelle'?'notée':'comptage'}</div></div>
        <button class="undo" type="button" data-vundo="${esc(m.id)}">Annuler</button></div>`).join('')}
      <p class="hint" style="padding:0 12px 12px">« Annuler » retire la vente du bilan. Pour une vente notée, la quantité revient dans le stock. Pour une vente trouvée au comptage, le stock compté ne change pas.</p></details>`:''})()}
    <h3 class="section-h">Stock actuel</h3>
    <div class="kpis"><div class="kpi"><span>Valeur au prix d'achat</span><b class="num">${dt(valAchat)}</b></div><div class="kpi"><span>Si tout est vendu</span><b class="num">${dt(valVente)}</b></div></div>
    ${nSansPrix?`<p class="hint">${nSansPrix} pièce${nSansPrix>1?'s':''} sans prix complet ne ${nSansPrix>1?'sont':'est'} pas comptée${nSansPrix>1?'s':''} dans ces totaux. Filtre « Prix manquant » dans l'onglet Stock pour les compléter.</p>`:''}
    ${downloads?`<h3 class="section-h">Sauvegarde</h3>
    <div class="box"><p class="hint">Télécharge tout dans un fichier Excel : stock, ventes et achats, bilan par mois, liste d'appro. Garde une copie de temps en temps.</p>
      <button class="btn block" type="button" id="xport">Exporter en Excel</button></div>`:''}`;
  $('#mprev').onclick=()=>{if(idx>0){moisSel=sorted[idx-1];render()}};
  view.querySelectorAll('[data-mk]').forEach(b=>b.onclick=()=>{moisSel=b.dataset.mk;render()});
  const vd=$('#vdet'); if(vd) vd.addEventListener('toggle',()=>{venteOpen=vd.open});
  view.querySelectorAll('[data-vundo]').forEach(b=>b.onclick=async()=>{
    if(!b.classList.contains('armed')){b.classList.add('armed');b.textContent='Confirmer ?';setTimeout(()=>{if(b.isConnected){b.classList.remove('armed');b.textContent='Annuler'}},3500);return}
    const m=mouvements.find(x=>x.id===b.dataset.vundo); if(!m) return; b.disabled=true;
    try{await db.doc('mouvements/'+m.id).delete();
      const p=produits.find(x=>x.id===m.produitId);
      if(p&&m.source==='manuelle') await db.doc('produits/'+p.id).update({stock:(p.stock||0)+(m.qte||0)});
      toast('Vente annulée'+(p&&m.source==='manuelle'?' · '+m.qte+' remis en stock':''))}
    catch(e){toast('Annulation impossible, réessaie.');b.disabled=false}});
  $('#mnext').onclick=()=>{if(idx<sorted.length-1){moisSel=sorted[idx+1];render()}};
  const xb=$('#xport'); if(xb) xb.onclick=()=>exportExcel(xb);
  $('#kach').onclick=()=>{document.querySelector('nav.tabs [data-tab="courses"]').click();setTimeout(()=>{const h=$('#chist');if(h)h.scrollIntoView({block:'center'})},80)};
  view.querySelectorAll('.item').forEach(b=>b.onclick=()=>openDetail(b.dataset.id));
  bindTreso();
}

/* ---------- Trésorerie : relevés de caisse ---------- */
function tresoHTML(){
  const l=[...treso].sort((a,b)=>String(b.date).localeCompare(String(a.date))), last=l[0];
  let est='';
  if(last){
    // depuis le dernier relevé : ventes notées (+) et appros payés après remise (−)
    let plus=0,moins=0;
    const totJour={}; mouvements.forEach(m=>{if(m.type==='achat'&&known(m.prixAchat)){const k=dayKey(m.date);totJour[k]=(totJour[k]||0)+m.qte*m.prixAchat}});
    mouvements.forEach(m=>{if(String(m.date)<=String(last.date))return;
      if(m.type==='vente'&&known(m.prixVente)) plus+=m.qte*m.prixVente;
      if(m.type==='achat'&&known(m.prixAchat)){const k=dayKey(m.date),t=totJour[k]||0;moins+=m.qte*m.prixAchat*(t?1-remiseDu(k)/t:1)}});
    moins=Math.round(moins);
    est=`<div class="kpis"><div class="kpi hero"><span>En caisse au ${esc(new Date(last.date).toLocaleDateString('fr-FR',{day:'numeric',month:'long'}))}</span><b class="num">${dt(last.montant)}</b></div>
      <div class="kpi"><span>Ventes notées depuis</span><b class="num">+ ${dt(plus)}</b></div><div class="kpi"><span>Appros payés depuis</span><b class="num">− ${dt(moins)}</b></div>
      <div class="kpi" style="grid-column:1/-1"><span>Estimation aujourd'hui</span><b class="num">${dt(last.montant+plus-moins)}</b></div></div>
      <p class="hint">Estimation faite seulement avec ce qui est noté dans l'appli. Les ventes trouvées au comptage comptent le jour du comptage, et les autres dépenses (loyer, électricité…) ne sont pas prises en compte.${last.note?` Note du dernier relevé : « ${esc(last.note)} ».`:''}</p>`;
  }
  return `<h2 class="section-h" style="margin:0">Trésorerie</h2>
    <div class="box">${est||'<p class="hint">Note ici ce que tu as en caisse. L\'appli estimera ensuite la caisse à partir des ventes et des appros notés.</p>'}
      <div class="row2"><div class="field"><label for="tmont">Montant en caisse (DT)</label><input id="tmont" inputmode="decimal" placeholder="ex. 350 ou 350,500"><span class="mmhint" id="tmonth"></span></div>
        <div class="field"><label for="tnote">Note (facultatif)</label><input id="tnote" placeholder="ex. caisse + poche"></div></div>
      <button class="btn primary" type="button" id="tok">Enregistrer la caisse d'aujourd'hui</button>
      ${l.length?`<details><summary class="hint" style="cursor:pointer">Relevés précédents (${l.length})</summary><div class="list" style="margin-top:8px">${l.map(t=>`<div class="lrow"><div class="info"><div class="num" style="font-weight:600">${dt(t.montant)}</div><div class="meta">${esc(new Date(t.date).toLocaleDateString('fr-FR',{day:'numeric',month:'short',year:'numeric'}))}${t.note?' · '+esc(t.note):''}</div></div><button class="undo" type="button" data-tdel="${esc(t.id)}">Supprimer</button></div>`).join('')}</div></details>`:''}</div>`;
}
function bindTreso(){
  const i=$('#tmont'); if(!i) return;
  i.addEventListener('input',()=>{const v=dinars(i.value);$('#tmonth').textContent=v===null?'':'= '+dt(v)});
  $('#tok').onclick=async()=>{const b=$('#tok'),v=dinars(i.value);
    if(v===null){toast('Tape un montant, par exemple 350 ou 350,500.');i.focus();return}
    b.disabled=true;
    try{await db.collection('tresorerie').add({montant:v,note:$('#tnote').value.trim(),date:new Date().toISOString()});toast('Caisse enregistrée : '+dt(v))}
    catch(e){toast('Enregistrement impossible, réessaie.');b.disabled=false}};
  view.querySelectorAll('[data-tdel]').forEach(b=>b.onclick=async()=>{
    if(!b.classList.contains('armed')){b.classList.add('armed');b.textContent='Confirmer ?';setTimeout(()=>{if(b.isConnected){b.classList.remove('armed');b.textContent='Supprimer'}},3500);return}
    b.disabled=true;try{await db.doc('tresorerie/'+b.dataset.tdel).delete();toast('Relevé supprimé')}catch(e){toast('Suppression impossible.');b.disabled=false}});
}

/* ---------- Export Excel ---------- */
let xlsxLib=null;
function loadXlsx(){
  if(window.XLSX) return Promise.resolve(window.XLSX);
  if(!xlsxLib) xlsxLib=new Promise((res,rej)=>{const sc=document.createElement('script');sc.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';sc.onload=()=>window.XLSX?res(window.XLSX):rej(new Error('lib'));sc.onerror=()=>{xlsxLib=null;rej(new Error('lib'))};document.head.appendChild(sc)});
  return xlsxLib;
}
const DTv=v=>known(v)?v/1000:null;   // millimes -> dinars, cellule vide si inconnu
const TYPES={vente:'Vente',achat:'Achat',correction:'Correction de stock',ecart:'Trouvé en plus au comptage'};
function feuille(X,rows,cols,money){
  const ws=X.utils.aoa_to_sheet([cols.map(c=>c[0]),...rows]);
  ws['!cols']=cols.map(c=>({wch:c[1]}));
  ws['!autofilter']={ref:X.utils.encode_range({s:{r:0,c:0},e:{r:Math.max(rows.length,1),c:cols.length-1}})};
  for(let r=1;r<=rows.length;r++) money.forEach(c=>{const cell=ws[X.utils.encode_cell({r,c})];if(cell&&cell.t==='n')cell.z='#,##0.000'});
  Object.keys(ws).forEach(k=>{const cell=ws[k];if(k[0]!=='!'&&cell&&cell.z==='m/d/yy'){cell.z='dd/mm/yyyy hh:mm';delete cell.w}});
  return ws;
}
async function exportExcel(b){
  if(!downloads) return;
  b.disabled=true; const lbl=b.textContent; b.textContent='Préparation du fichier…';
  try{
    const X=await loadXlsx();
    const d=iso=>iso?new Date(iso):null;
    const stock=[...produits].sort((a,c)=>norm(a.nom).localeCompare(norm(c.nom))).map(p=>[
      p.nom, CAT[p.categorie]||'', p.emplacement||(locSrc(p)?'(photo)':''), p.stock||0, p.seuil||0,
      DTv(p.prixAchat), DTv(p.prixVente), known(p.prixAchat)&&known(p.prixVente)?(p.prixVente-p.prixAchat)/1000:null,
      known(p.prixAchat)?(p.stock||0)*p.prixAchat/1000:null, p.notes||'', d(p.dernierComptage)]);
    const mv=[...mouvements].sort((a,c)=>String(a.date).localeCompare(String(c.date))).map(m=>{
      const vente=m.type==='vente';
      return [d(m.date), TYPES[m.type]||m.type, m.nom||'', m.qte,
        vente?(m.source==='manuelle'?'Saisie':'Comptage'):'',
        DTv(m.prixVente), DTv(m.prixAchat),
        vente&&known(m.prixVente)?m.qte*m.prixVente/1000:null,
        vente&&known(m.prixVente)&&known(m.prixAchat)?m.qte*(m.prixVente-m.prixAchat)/1000:null,
        m.type==='achat'&&known(m.prixAchat)?m.qte*m.prixAchat/1000:null]});
    const mois={}; mouvements.forEach(m=>{const k=moisKey(m.date);if(!k)return;const a=mois[k]||(mois[k]={ca:0,mg:0,pc:0,ach:0,inc:0});
      if(m.type==='vente'){a.pc+=m.qte;if(known(m.prixVente))a.ca+=m.qte*m.prixVente;if(known(m.prixVente)&&known(m.prixAchat))a.mg+=m.qte*(m.prixVente-m.prixAchat);else a.inc+=m.qte}
      else if(m.type==='achat'&&known(m.prixAchat))a.ach+=m.qte*m.prixAchat});
    const bilan=Object.keys(mois).sort().map(k=>{const a=mois[k];return [moisLabel(k),a.pc,a.ca/1000,a.mg/1000,(a.ach-remisesMois(k))/1000,a.inc]});
    const appro=courses.filter(c=>!c.ignore).map(c=>{const p=c.produitId&&produits.find(x=>x.id===c.produitId);
      return [p?p.nom:c.texte,c.qte||1,DTv(known(c.prixAchat)?c.prixAchat:(p?p.prixAchat:null)),c.note||'',c.fait?'Oui':'Non',c.stocke?'Oui':'Non']});
    const wb=X.utils.book_new();
    X.utils.book_append_sheet(wb,feuille(X,stock,[['Pièce',34],['Catégorie',10],['Emplacement',14],['Stock',8],['Alerte si ≤',10],["Prix d'achat (DT)",14],['Prix de vente (DT)',15],['Marge unitaire (DT)',16],['Valeur du stock (DT)',17],['Notes',40],['Dernier comptage',16]],[5,6,7,8]),'Stock');
    X.utils.book_append_sheet(wb,feuille(X,mv,[['Date',18],['Type',24],['Pièce',34],['Quantité',10],['Origine',11],['Prix de vente (DT)',15],["Prix d'achat (DT)",14],["Chiffre d'affaires (DT)",18],['Marge (DT)',12],['Coût achat (DT)',14]],[5,6,7,8,9]),'Mouvements');
    X.utils.book_append_sheet(wb,feuille(X,bilan,[['Mois',16],['Pièces vendues',14],["Chiffre d'affaires (DT)",18],['Marge (DT)',12],['Achats fournisseur après remises (DT)',30],['Vendues sans prix complet',22]],[2,3,4]),'Bilan mensuel');
    X.utils.book_append_sheet(wb,feuille(X,appro,[['Pièce',34],['Quantité',10],["Prix d'achat (DT)",14],['Note',24],['Pris',8],['Mis en stock',12]],[2]),'Appro');
    const buf=X.write(wb,{bookType:'xlsx',type:'array',cellDates:true});
    const t=new Date(), f='Boutique-Stoufa-'+t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0')+'.xlsx';
    await downloads.save({filename:f,data:buf});
    toast('Fichier Excel enregistré');
  }catch(e){
    const c=e&&e.code;
    if(c==='declined'){} else if(c==='rate_limited') toast('Une fenêtre de téléchargement est déjà ouverte.');
    else if(e&&e.message==='lib') toast("Impossible de préparer le fichier. Vérifie ta connexion et réessaie.");
    else toast("Export impossible pour le moment.");
  }finally{if(b.isConnected){b.disabled=false;b.textContent=lbl}}
}

/* ---------- Démarrage ---------- */
render();
(async()=>{
  if(!window.claude||!window.claude.use){render();return}
  try{db=await window.claude.use('db')}catch(e){db=null}
  if(!db){render();return}
  render();
  window.claude.use('assets').then(a=>{assets=a}).catch(()=>{});

  let gotP=false,gotM=false;
  db.collection('produits').onSnapshot(s=>{produits=s.docs.map(d=>({id:d.id,...d.data()}));setTimeout(refreshDetail,0);gotP=true;const was=loaded;loaded=gotP&&gotM;if(tab==='vente'&&was){venteRefresh()}else if(tab==='courses'&&was){coursesRefresh()}else if(!(tab==='comptage'&&document.activeElement&&document.activeElement.matches('.crow input,#cqs')))render();else updSave();if(was)approRefresh()},e=>toast('Connexion au stock perdue. Recharge la page.'));
  db.collection('mouvements').onSnapshot(s=>{mouvements=s.docs.map(d=>({id:d.id,...d.data()}));gotM=true;const was=loaded;loaded=gotP&&gotM;if(tab==='vente'&&was)venteRefresh();else if(tab==='courses'&&was)coursesRefresh();else if(tab!=='comptage'&&!(document.activeElement&&['tmont','tnote'].includes(document.activeElement.id)))render();if(was)approRefresh()},e=>{});
  db.collection('tresorerie').onSnapshot(s=>{treso=s.docs.map(d=>({id:d.id,...d.data()}));const a=document.activeElement;if(loaded&&tab==='bilan'&&!(a&&(a.id==='tmont'||a.id==='tnote')))render()},e=>{});
  db.collection('appros').onSnapshot(s=>{appros=s.docs.map(d=>({id:d.id,...d.data()}));if(loaded)approRefresh()},e=>{});
  db.collection('courses').onSnapshot(s=>{courses=s.docs.map(d=>({id:d.id,...d.data()}));if(tab==='courses'&&loaded)coursesRefresh()},e=>{});
})();
})();
